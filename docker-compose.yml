services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                PHP_VERSION: '${PHP_VERSION:-8.2}'
                NODE_VERSION: '${NODE_VERSION:-20}'
        image: '${COMPOSE_PROJECT_NAME:-myapp}-plod-${PHP_VERSION:-8.2}/app'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${HMR_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_PLOD: 1
            XDEBUG_MODE: '${PLOD_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${PLOD_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            PHP_IDE_CONFIG: 'serverName=${PROJECT_DOMAIN:-myapp.test}'
            MAILPIT_ENABLED: '${MAILPIT_ENABLED:-true}'
            MAILPIT_HOST: '${MAILPIT_HOST:-mailpit}'
            MAILPIT_PORT: '${MAILPIT_PORT:-1025}'
            MAILPIT_FROM_EMAIL: '${MAILPIT_FROM_EMAIL:-noreply@${PROJECT_DOMAIN:-myapp.test}}'
            MAILPIT_FROM_NAME: '${MAILPIT_FROM_NAME:-MyApp}'
        volumes:
            - '.:/var/www/html'
        networks:
            - plod
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            retries: 3
            timeout: 5s
            interval: 30s
    mysql:
        image: 'mysql:${MYSQL_VERSION:-8.0}'
        restart: unless-stopped
        profiles:
            - mysql
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-root}'
            MYSQL_DATABASE: '${DB_DATABASE:-myapp}'
            MYSQL_USER: '${DB_USERNAME:-myapp}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'plod-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - plod
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
            retries: 3
            timeout: 5s
            interval: 10s
    postgres:
        image: 'postgres:${POSTGRES_VERSION:-16}'
        restart: unless-stopped
        profiles:
            - postgres
        ports:
            - '${FORWARD_POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${POSTGRES_DB:-myapp}'
            POSTGRES_USER: '${POSTGRES_USER:-myapp}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-secret}'
        volumes:
            - 'plod-postgres:/var/lib/postgresql/data'
            - './docker/postgres/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - plod
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB:-myapp}", "-U", "${POSTGRES_USER:-myapp}"]
            retries: 3
            timeout: 5s
            interval: 10s
    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        profiles:
            - redis
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'plod-redis:/data'
        networks:
            - plod
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
            interval: 10s
    mailpit:
        image: 'axllent/mailpit:v1.20'
        restart: unless-stopped
        profiles:
            - mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - plod
    ssl-proxy:
        image: 'nginx:alpine'
        restart: unless-stopped
        profiles:
            - ssl
        ports:
            - '${FORWARD_SSL_PORT:-443}:443'
        volumes:
            - './docker/ssl/nginx.conf:/etc/nginx/nginx.conf:ro'
            - './docker/ssl/certs:/etc/nginx/ssl:ro'
        networks:
            - plod
        depends_on:
            - app
networks:
    plod:
        driver: bridge
volumes:
    plod-mysql:
        driver: local
    plod-postgres:
        driver: local
    plod-redis:
        driver: local
